<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus Support AI</title>
  <meta name="description" content="Nimbus Support AI — your intelligent customer support assistant for Nimbus home goods." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #131929;
      --glass:     rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --teal:      #00d4aa;
      --teal-dim:  #00a887;
      --teal-glow: rgba(0,212,170,0.20);
      --text:      #e8eaf0;
      --muted:     #6b7390;
      --user-grad: linear-gradient(135deg, #00d4aa 0%, #0099cc 100%);
      --radius:    16px;
      --font:      'Inter', sans-serif;
    }

    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

    /* ── layout ── */
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── navbar ── */
    .navbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 0 24px;
      height: 64px;
      background: rgba(13,18,32,0.90);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .navbar-logo {
      width: 36px; height: 36px;
      background: var(--user-grad);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .navbar-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .navbar-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      margin-left: auto;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .4; }
    }
    .btn-reset {
      margin-left: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px; font-family: var(--font);
      padding: 6px 14px; border-radius: 8px;
      cursor: pointer; transition: all .2s;
    }
    .btn-reset:hover { border-color: var(--teal); color: var(--teal); }

    /* ── chat area ── */
    #chat {
      flex: 1; overflow-y: auto; padding: 24px 0;
      display: flex; flex-direction: column; gap: 20px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 0 24px;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .msg-row.user  { flex-direction: row-reverse; }

    /* avatar */
    .avatar {
      width: 32px; height: 32px; border-radius: 10px;
      display: grid; place-items: center; font-size: 14px;
      flex-shrink: 0;
    }
    .avatar.ai   { background: linear-gradient(135deg,#1e293b,#0f172a); border: 1px solid var(--border); }
    .avatar.user { background: var(--user-grad); }

    /* bubble */
    .bubble {
      max-width: min(68%, 640px);
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px; line-height: 1.65;
      position: relative;
    }
    .bubble.ai {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--user-grad);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble .ts {
      display: block; font-size: 10px;
      margin-top: 8px; opacity: .45;
      text-align: right;
    }
    .bubble.ai .ts { text-align: left; }

    /* markdown-ish styling inside AI bubbles */
    .bubble.ai strong { color: var(--teal); font-weight: 600; }
    .bubble.ai code {
      background: rgba(0,212,170,.1); border-radius: 4px;
      padding: 1px 5px; font-size: 12px; font-family: monospace;
    }
    .bubble.ai ul { padding-left: 18px; margin-top: 6px; }
    .bubble.ai li { margin-top: 4px; }

    /* typing indicator */
    .typing { display: flex; align-items: center; gap: 5px; padding: 14px 18px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--teal); opacity: .6;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,80%,100% { transform: scale(.8); opacity:.4; }
      40%         { transform: scale(1.2); opacity:1; }
    }

    /* welcome card */
    .welcome {
      margin: auto 24px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
      animation: fadeUp .5s ease both;
    }
    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .welcome p  { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 380px; margin: 0 auto 24px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: rgba(0,212,170,.08);
      border: 1px solid rgba(0,212,170,.25);
      color: var(--teal); font-size: 12px; font-family: var(--font);
      padding: 7px 14px; border-radius: 20px;
      cursor: pointer; transition: all .2s;
    }
    .chip:hover { background: rgba(0,212,170,.18); transform: translateY(-1px); }

    /* ── input bar ── */
    .input-bar {
      flex-shrink: 0;
      padding: 16px 24px 20px;
      background: rgba(11,15,26,.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-glow);
    }
    #userInput {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: var(--font);
      resize: none; max-height: 120px; line-height: 1.5;
      overflow-y: auto;
    }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 38px; height: 38px; flex-shrink: 0;
      background: var(--user-grad);
      border: none; border-radius: 10px;
      cursor: pointer; display: grid; place-items: center;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 0 0 0 var(--teal-glow);
    }
    #sendBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 16px var(--teal-glow);
    }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; fill: #fff; }
    .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
  <div class="navbar-logo">🌥️</div>
  <div>
    <div class="navbar-title">Nimbus Support AI</div>
    <div class="navbar-sub">Powered by LangGraph · Claude</div>
  </div>
  <div class="status-dot" id="statusDot" title="Online"></div>
  <button class="btn-reset" id="resetBtn" title="Clear conversation">↺ New chat</button>
</nav>

<!-- ── Chat window ── -->
<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">🌥️</div>
    <h1>Hi, I'm Nimbus Support AI</h1>
    <p>I can help with shipping, returns, product care, and your account. What can I help you with today?</p>
    <div class="chips">
      <button class="chip" onclick="sendChip(this)">📦 Where's my order?</button>
      <button class="chip" onclick="sendChip(this)">↩️ How do I return an item?</button>
      <button class="chip" onclick="sendChip(this)">🚚 Shipping policy</button>
      <button class="chip" onclick="sendChip(this)">👤 Check my account</button>
    </div>
  </div>
</div>

<!-- ── Input bar ── -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="userInput" rows="1" placeholder="Ask me anything about Nimbus…"></textarea>
    <button id="sendBtn" title="Send message" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
</div>

<script>
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('userInput');
  const sendBtn   = document.getElementById('sendBtn');
  const resetBtn  = document.getElementById('resetBtn');
  const welcome   = document.getElementById('welcome');
  const statusDot = document.getElementById('statusDot');

  let busy = false;

  // ── auto-grow textarea ─────────────────────────────────────────────────────
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── keyboard submit ────────────────────────────────────────────────────────
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);
  resetBtn.addEventListener('click', reset);

  // ── chip shortcuts ─────────────────────────────────────────────────────────
  function sendChip(el) {
    input.value = el.textContent.replace(/^[^\w]+/, '').trim();
    send();
  }

  // ── helpers ────────────────────────────────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function addMsg(text, role) {
    welcome?.remove();

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const av = document.createElement('div');
    av.className = `avatar ${role}`;
    av.textContent = role === 'ai' ? '🌥️' : '👤';

    const bub = document.createElement('div');
    bub.className = `bubble ${role}`;
    bub.innerHTML = role === 'ai' ? renderMarkdown(text) : escHtml(text);
    bub.innerHTML += `<span class="ts">${now()}</span>`;

    row.append(av, bub);
    chat.appendChild(row);
    scrollBottom();
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';

    const av = document.createElement('div');
    av.className = 'avatar ai';
    av.textContent = '🌥️';

    const bub = document.createElement('div');
    bub.className = 'bubble ai typing';
    bub.innerHTML = '<span></span><span></span><span></span>';

    row.append(av, bub);
    chat.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    document.getElementById('typing-row')?.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Very minimal markdown → html
  function renderMarkdown(text) {
    return escHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n/g, '<br>');
  }

  // ── send ───────────────────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMsg(text, 'user');
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMsg(`⚠️ Error: ${err.detail || res.statusText}`, 'ai');
      } else {
        const data = await res.json();
        addMsg(data.reply, 'ai');
      }
    } catch (err) {
      hideTyping();
      addMsg('⚠️ Could not reach the server. Is it running?', 'ai');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── reset ──────────────────────────────────────────────────────────────────
  async function reset() {
    await fetch('/reset', { method: 'POST' }).catch(() => {});
    chat.innerHTML = '';
    // re-add welcome card
    const w = document.createElement('div');
    w.className = 'welcome'; w.id = 'welcome';
    w.innerHTML = `
      <div class="icon">🌥️</div>
      <h1>Hi, I'm Nimbus Support AI</h1>
      <p>I can help with shipping, returns, product care, and your account. What can I help you with today?</p>
      <div class="chips">
        <button class="chip" onclick="sendChip(this)">📦 Where's my order?</button>
        <button class="chip" onclick="sendChip(this)">↩️ How do I return an item?</button>
        <button class="chip" onclick="sendChip(this)">🚚 Shipping policy</button>
        <button class="chip" onclick="sendChip(this)">👤 Check my account</button>
      </div>`;
    chat.appendChild(w);
    input.focus();
  }

  // ── health check ──────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      statusDot.style.background = d.ready ? '#22c55e' : '#f59e0b';
      statusDot.style.boxShadow  = d.ready ? '0 0 8px #22c55e' : '0 0 8px #f59e0b';
      statusDot.title = d.ready ? `Online · ${d.chunks} chunks` : 'Starting up…';
    } catch {
      statusDot.style.background = '#ef4444';
      statusDot.style.boxShadow  = '0 0 8px #ef4444';
      statusDot.title = 'Offline';
    }
  }

  checkHealth();
  setInterval(checkHealth, 15000);
  input.focus();
</script>
</body>
</html>
