<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus Support AI</title>
  <meta name="description" content="Nimbus Support AI — your intelligent customer support assistant for Nimbus home goods." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #131929;
      --glass:     rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --teal:      #00d4aa;
      --teal-dim:  #00a887;
      --teal-glow: rgba(0,212,170,0.20);
      --text:      #e8eaf0;
      --muted:     #6b7390;
      --user-grad: linear-gradient(135deg, #00d4aa 0%, #0099cc 100%);
      --radius:    16px;
      --font:      'Inter', sans-serif;
    }

    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

    /* ── layout ── */
    body { display: flex; flex-direction: row; height: 100vh; overflow: hidden; }

    /* ── sidebar ── */
    .sidebar {
      width: 260px;
      background: #0d1220;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .btn-new-chat {
      width: 100%;
      background: var(--user-grad);
      border: none;
      color: #0b0f1a;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-new-chat:hover { opacity: 0.9; }
    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .session-list::-webkit-scrollbar { width: 4px; }
    .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-item:hover {
      background: var(--glass);
      color: var(--text);
    }
    .session-item.active {
      background: rgba(0, 212, 170, 0.12);
      color: var(--teal);
      border: 1px solid var(--teal-glow);
    }
    .session-item .session-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-delete-session {
      flex-shrink: 0;
      background: none;
      border: none;
      color: transparent;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }
    .session-item:hover .btn-delete-session {
      color: var(--muted);
    }
    .btn-delete-session:hover {
      color: #ef4444 !important;
      background: rgba(239,68,68,0.12);
    }

    /* ── main container ── */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── navbar ── */
    .navbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 0 24px;
      height: 64px;
      background: rgba(13,18,32,0.90);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .navbar-logo {
      width: 36px; height: 36px;
      background: var(--user-grad);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .navbar-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .navbar-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      margin-left: auto;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .4; }
    }
    .btn-reset {
      margin-left: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px; font-family: var(--font);
      padding: 6px 14px; border-radius: 8px;
      cursor: pointer; transition: all .2s;
    }
    .btn-reset:hover { border-color: var(--teal); color: var(--teal); }

    /* ── chat area ── */
    #chat {
      flex: 1; overflow-y: auto; padding: 24px 0;
      display: flex; flex-direction: column; gap: 20px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 0 24px;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .msg-row.user  { flex-direction: row-reverse; }

    /* avatar */
    .avatar {
      width: 32px; height: 32px; border-radius: 10px;
      display: grid; place-items: center; font-size: 14px;
      flex-shrink: 0;
    }
    .avatar.ai   { background: rgba(0,212,170,0.15); border: 1px solid var(--teal-glow); }
    .avatar.user { background: var(--user-grad); color: #fff; }

    /* bubble */
    .bubble {
      max-width: 680px; padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px; line-height: 1.6;
      word-break: break-word;
      position: relative;
    }
    .bubble.user {
      background: var(--user-grad); color: #0b0f1a;
      border-bottom-right-radius: 4px; font-weight: 500;
    }
    .bubble.ai {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-bottom-left-radius: 4px;
    }
    .bubble ul { margin-left: 18px; margin-top: 6px; }
    .bubble code {
      background: rgba(255,255,255,0.08); padding: 2px 6px;
      border-radius: 4px; font-size: 13px; font-family: monospace;
    }

    .ts {
      display: block; font-size: 10px; color: var(--muted);
      margin-top: 6px; text-align: right;
    }
    .bubble.user .ts { color: rgba(11,15,26,0.5); }

    /* typing indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 16px 20px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--teal);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-6px); }
    }

    /* welcome card */
    .welcome {
      margin: auto; max-width: 520px; text-align: center;
      padding: 32px 24px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .welcome .icon { font-size: 40px; margin-bottom: 12px; }
    .welcome h1    { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .welcome p     { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--glass); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; padding: 8px 14px;
      border-radius: 20px; cursor: pointer; transition: all .2s;
      font-family: var(--font);
    }
    .chip:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-glow); }

    /* ── input box ── */
    .input-bar {
      flex-shrink: 0; padding: 16px 24px 24px;
      background: rgba(11,15,26,0.95);
      border-top: 1px solid var(--border);
    }
    .input-wrapper {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-glow);
    }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: var(--font);
      resize: none; max-height: 140px; min-height: 24px; line-height: 1.5;
    }
    textarea::placeholder { color: var(--muted); }
    .btn-send {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--user-grad); border: none; color: #0b0f1a;
      font-size: 16px; cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0; transition: opacity .2s, transform .1s;
    }
    .btn-send:hover   { opacity: .9; }
    .btn-send:active  { transform: scale(.95); }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="btn-new-chat" onclick="createNewSession()">
        <span>✨</span> New Chat
      </button>
    </div>
    <div class="session-list" id="session-list">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <!-- Main Chat Container -->
  <div class="main-container">
    <!-- Navbar -->
    <div class="navbar">
      <div class="navbar-logo">🌥️</div>
      <div>
        <div class="navbar-title">Nimbus Support AI</div>
        <div class="navbar-sub">Always online · MongoDB Atlas Session Tracking</div>
      </div>
      <div class="status-dot" id="status-dot" title="Checking…"></div>
      <button class="btn-reset" onclick="resetCurrentSession()">Reset</button>
    </div>

    <!-- Chat messages -->
    <div id="chat">
      <div class="welcome" id="welcome">
        <div class="icon">🌥️</div>
        <h1>Hi, I'm Nimbus Support AI</h1>
        <p>I can help with shipping, returns, product care, and your account. What can I help you with today?</p>
        <div class="chips">
          <button class="chip" onclick="sendChip(this)">📦 Where's my order?</button>
          <button class="chip" onclick="sendChip(this)">↩️ How do I return an item?</button>
          <button class="chip" onclick="sendChip(this)">🚚 Shipping policy</button>
          <button class="chip" onclick="sendChip(this)">👤 Check my account</button>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="input-wrapper">
        <textarea id="input" placeholder="Ask Nimbus Support anything…" rows="1"></textarea>
        <button class="btn-send" id="btn-send" onclick="send()">➔</button>
      </div>
    </div>
  </div>

<script>
  const chat       = document.getElementById('chat');
  const input      = document.getElementById('input');
  const sendBtn    = document.getElementById('btn-send');
  const statusDot  = document.getElementById('status-dot');
  const sessionListEl = document.getElementById('session-list');

  let busy = false;
  let currentSessionId = localStorage.getItem('nimbus_session_id') || generateUUID();
  localStorage.setItem('nimbus_session_id', currentSessionId);

  function generateUUID() {
    return 'session-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now().toString(36);
  }

  // ── auto-resize textarea ──
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function sendChip(btn) {
    input.value = btn.textContent.replace(/^[\u1F00-\u1F9FF\u2600-\u26FF\u2700-\u27BF\s]+/, '').trim();
    send();
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function renderWelcome() {
    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="icon">🌥️</div>
        <h1>Hi, I'm Nimbus Support AI</h1>
        <p>I can help with shipping, returns, product care, and your account. What can I help you with today?</p>
        <div class="chips">
          <button class="chip" onclick="sendChip(this)">📦 Where's my order?</button>
          <button class="chip" onclick="sendChip(this)">↩️ How do I return an item?</button>
          <button class="chip" onclick="sendChip(this)">🚚 Shipping policy</button>
          <button class="chip" onclick="sendChip(this)">👤 Check my account</button>
        </div>
      </div>`;
  }

  // ── Session Management ─────────────────────────────────────────────────────
  async function loadSessionsList() {
    try {
      const res = await fetch('/sessions');
      if (!res.ok) return;
      const data = await res.json();
      sessionListEl.innerHTML = '';

      if (!data.sessions || data.sessions.length === 0) {
        sessionListEl.innerHTML = '<div style="padding:12px; font-size:11px; color:var(--muted); text-align:center;">No past chats</div>';
        return;
      }

      data.sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = `session-item ${s.session_id === currentSessionId ? 'active' : ''}`;
        item.title = s.session_id;

        const label = document.createElement('span');
        label.className = 'session-label';
        label.textContent = '💬 ' + (s.preview || s.session_id);
        label.onclick = () => switchSession(s.session_id);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-session';
        delBtn.title = 'Delete session';
        delBtn.textContent = '🗑';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };

        item.append(label, delBtn);
        sessionListEl.appendChild(item);
      });
    } catch (e) {
      console.error('Failed to load sessions', e);
    }
  }

  async function switchSession(sid) {
    if (busy) return;
    currentSessionId = sid;
    localStorage.setItem('nimbus_session_id', sid);
    loadSessionsList();

    chat.innerHTML = '';
    try {
      const res = await fetch(`/sessions/${sid}/messages`);
      const data = await res.json();
      if (!data.messages || data.messages.length === 0) {
        renderWelcome();
      } else {
        data.messages.forEach(m => {
          addMsg(m.content, m.role === 'user' ? 'user' : 'ai', false);
        });
      }
    } catch (e) {
      renderWelcome();
    }
  }

  function createNewSession() {
    if (busy) return;
    currentSessionId = generateUUID();
    localStorage.setItem('nimbus_session_id', currentSessionId);
    renderWelcome();
    loadSessionsList();
    input.focus();
  }

  async function deleteSession(sid) {
    if (!confirm('Delete this session and all its messages?')) return;
    try {
      await fetch(`/sessions/${sid}`, { method: 'DELETE' });
    } catch (e) {
      console.error('Failed to delete session', e);
    }
    // If the deleted session was active, start a fresh one
    if (sid === currentSessionId) {
      currentSessionId = generateUUID();
      localStorage.setItem('nimbus_session_id', currentSessionId);
      renderWelcome();
    }
    loadSessionsList();
  }

  // ── render message ─────────────────────────────────────────────────────────
  function addMsg(text, role, animate = true) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    if (!animate) row.style.animation = 'none';

    const av = document.createElement('div');
    av.className = `avatar ${role}`;
    av.textContent = role === 'ai' ? '🌥️' : '👤';

    const bub = document.createElement('div');
    bub.className = `bubble ${role}`;
    bub.innerHTML = role === 'ai' ? renderMarkdown(text) : escHtml(text);
    bub.innerHTML += `<span class="ts">${now()}</span>`;

    row.append(av, bub);
    chat.appendChild(row);
    scrollBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar ai">🌥️</div>
      <div class="bubble ai typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    document.getElementById('typing-row')?.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Minimal markdown → html
  function renderMarkdown(text) {
    return escHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n/g, '<br>');
  }

  // ── send message ───────────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMsg(text, 'user');
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMsg(`⚠️ Error: ${err.detail || res.statusText}`, 'ai');
      } else {
        const data = await res.json();
        if (data.session_id) {
          currentSessionId = data.session_id;
          localStorage.setItem('nimbus_session_id', currentSessionId);
        }
        addMsg(data.reply, 'ai');
        loadSessionsList();
      }
    } catch (err) {
      hideTyping();
      addMsg('⚠️ Could not reach the server. Is it running?', 'ai');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── reset session ──────────────────────────────────────────────────────────
  async function resetCurrentSession() {
    await fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSessionId }),
    }).catch(() => {});

    renderWelcome();
    loadSessionsList();
    input.focus();
  }

  // ── health check ──────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      statusDot.style.background = d.ready ? '#22c55e' : '#f59e0b';
      statusDot.style.boxShadow  = d.ready ? '0 0 8px #22c55e' : '0 0 8px #f59e0b';
      statusDot.title = d.ready ? `Online · ${d.chunks} chunks` : 'Starting up…';
    } catch {
      statusDot.style.background = '#ef4444';
      statusDot.style.boxShadow  = '0 0 8px #ef4444';
      statusDot.title = 'Offline';
    }
  }

  checkHealth();
  setInterval(checkHealth, 15000);
  input.focus();
</script>
</body>
</html>
